name: React CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # TRABAJO 1: Integración Continua (corre en PRs y en main)
  verificar-y-compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar codigo
        run: npm run lint

      - name: Compilar proyecto
        run: npm run build

      # Guarda la carpeta dist/ para pasarla al siguiente job
      - name: Subir artefacto de compilacion
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # TRABAJO 2: Despliegue Continuo (solo corre cuando se integra a main y pasó el CI)
  desplegar-produccion:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verificar-y-compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4